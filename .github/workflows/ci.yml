name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: true

jobs:
  build-test-validate:
    name: Build, Test, Validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          # net8.0 目標框架的測試需要 .NET 8 執行階段；SDK 仍依 global.json 使用 .NET 10。
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore InputWeave.GameInput.slnx

      - name: Build
        run: dotnet build InputWeave.GameInput.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test InputWeave.GameInput.slnx -c Release --no-build

      # pack 會執行 EnablePackageValidation，提早發現各目標框架公開 API 不一致。
      - name: Pack with package validation
        run: dotnet pack src/InputWeave.GameInput/InputWeave.GameInput.csproj -c Release --no-build -o .tmp/packages

      # 以 NativeAOT 實際發佈並執行煙霧測試；trim／AOT 警告依 TreatWarningsAsErrors 視為錯誤。
      # 代理程式沒有 GameInput 執行階段時，煙霧測試只驗證受控載入器與探測路徑。
      - name: Publish and run NativeAOT smoke test
        run: |
          foreach ($framework in @('net8.0', 'net10.0')) {
              $output = ".tmp/aot/$framework"
              dotnet publish tests/InputWeave.GameInput.AotSmoke/InputWeave.GameInput.AotSmoke.csproj -c Release -f $framework -r win-x64 -o $output
              if ($LASTEXITCODE -ne 0) {
                  throw "NativeAOT 發佈失敗：$framework"
              }

              & "$output/InputWeave.GameInput.AotSmoke.exe"
              if ($LASTEXITCODE -ne 0) {
                  throw "NativeAOT 煙霧測試執行失敗：$framework（結束代碼 $LASTEXITCODE）"
              }
          }

      - name: Verify formatting
        run: dotnet format InputWeave.GameInput.slnx --verify-no-changes

      - name: Validate text encoding
        run: pwsh ./eng/Validate-TextEncoding.ps1

      - name: Validate agent docs
        run: pwsh ./eng/Validate-AgentDocs.ps1

      - name: Verify GameInput bindings
        run: pwsh ./eng/Verify-GameInputBindings.ps1

      - name: Verify GameInput coverage
        run: pwsh ./eng/Verify-GameInputCoverage.ps1

      - name: Verify documentation snippets
        run: pwsh ./eng/Verify-DocSnippets.ps1
